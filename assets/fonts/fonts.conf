<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 서버(Vercel 람다)에는 시스템 폰트가 없다. SVG 도형 검증용 래스터라이즈(sharp/librsvg)가 한글 라벨을 그릴 수 있도록
     Pretendard(OFL) 하나를 번들하고 모든 generic family 를 여기로 보낸다. src/lib/vision/svg-raster.ts 가 FONTCONFIG_PATH 로 가리킨다. -->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <alias><family>serif</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Pretendard</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Pretendard</family></prefer></alias>
  <match target="pattern"><edit name="family" mode="append_last"><string>Pretendard</string></edit></match>
</fontconfig>
